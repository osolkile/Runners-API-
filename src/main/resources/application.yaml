server:
  port: 8080

spring:
  application:
    name: runners-auth
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/runners_auth?allowPublicKeyRetrieval=true&sslMode=DISABLED
    username: root
    password: ${DB_PASSWORD:kdtpass}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

kdt:
  jwt:
    secret:  ${JWT_SECRET:local-classroom-only-runners-01234567890123456789012345678901}
    access-seconds: 1800
    refresh-seconds: 604800